# Minimal nginx config for a Vite-built React SPA on Cloud Run.
#
# Key requirements:
#   - Listen on 8080 (Cloud Run's expected port)
#   - Serve static files from /usr/share/nginx/html
#   - Fall back to index.html for all unmatched paths (React Router support)
#   - Return 404 only for assets that genuinely don't exist (JS/CSS chunks, etc.)

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aggressive caching for hashed Vite assets (they include a content hash in
    # the filename, so they can be cached indefinitely).
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other requests → serve index.html so React Router can handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable nginx version in error pages / headers.
    server_tokens off;
}
