$kind: http-request
name: GET Microsoft Login
method: GET
url: '{{baseUrl}}/auth/microsoft/login'
order: 1000
description: Redirects the user to the Microsoft OAuth2 login page.
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Visualize the HTML response from the Microsoft login redirect
      const html = pm.response.text();
      pm.visualizer.set(`
        <html>
          <head>
            <style>
              body { font-family: sans-serif; margin: 0; padding: 0; }
              iframe { width: 100%; height: 600px; border: none; }
              .info-bar {
                background: #f3f3f3;
                border-bottom: 1px solid #ddd;
                padding: 8px 16px;
                font-size: 13px;
                color: #555;
                display: flex;
                align-items: center;
                gap: 12px;
              }
              .badge {
                background: #0078d4;
                color: white;
                border-radius: 4px;
                padding: 2px 8px;
                font-size: 12px;
              }
            </style>
          </head>
          <body>
            <div class="info-bar">
              <span class="badge">Microsoft OAuth2</span>
              <span>Login page HTML response — Status: {{status}} {{statusText}}</span>
            </div>
            <iframe srcdoc="{{htmlContent}}"></iframe>
          </body>
        </html>
      `, {
        htmlContent: html.replace(/"/g, '&quot;'),
        status: pm.response.code,
        statusText: pm.response.status
      });